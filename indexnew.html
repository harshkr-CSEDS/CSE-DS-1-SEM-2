<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Photo Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #a52c2c;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    h2 {
   text-align: center;
   margin: 25px auto 10px;
   max-width: 1000px;
   color: #188295;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    @media (max-width: 500px) {
      .gallery img {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <h1>My BIRDS Photo Gallery</h1>
  <h2>KINGFISHER AND SPARROW</h2>

  <div class="gallery">
    <img src="https://photographylife.com/wp-content/uploads/2023/05/Nikon-Z8-Official-Samples-00021.jpg" alt="Photo 1" />
    <img src="https://i0.wp.com/www.heiko-sieger.info/wp-content/uploads/2024/08/Rosh-Tzipor_NIKON-Z-8_20240510_529-NIKON-Z-8-pick.jpg?ssl=1" alt="Photo 2" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcnL8CFoN_4-VOy2EdfMfu0ajw0oE2ZUD-Ow&s" alt="Photo 3" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYINVK8F5LStm09EEJCSLAsvkZrbumTyH8Dw&s" alt="Photo 4" />
    <img src="https://www.shutterstock.com/image-photo/charming-sparrow-perched-on-tree-260nw-2736668849.jpg" alt="Photo 5" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSkDoHBRkZ2wrA4b_xzmfE8u5_foYMFFUsrQ&s" alt="Photo 6" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX146XSoq5iTqwhcadSobhHgDwYXz9jhKXxA&s" alt="Photo 7" />
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxg8bUshTygSMsp_j7sYwzVcszhCGUmZjFRw&s" alt="Photo 8" />
  </div>
</body>
</html>
